[project]
name = "nl-ov-monitor"
version = "0.1.0"
description = "Monitors public transport strikes, disruptions, and engineering works across the Netherlands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.28.0",
    "ollama>=0.4.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tzlocal>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
